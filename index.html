<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Suite & Content Planner</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  
  <!-- Global Navigation Header -->
  <header id="main-header" class="header hidden">
    <div class="nav-container">
      <div class="nav-brand" id="nav-brand-btn">
        <div class="brand-icon-wrapper">
          <i data-lucide="play" class="brand-icon"></i>
        </div>
        <span class="brand-name">YT Planner <span class="brand-badge">v2.0</span></span>
      </div>
      
      <!-- Hamburger Menu Button -->
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">
        <i data-lucide="menu"></i>
      </button>

      <nav class="nav-links" id="nav-links">
        <a href="#dashboard" class="nav-link active" id="link-dashboard">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
        <a href="#calendar" class="nav-link" id="link-calendar">
          <i data-lucide="calendar"></i> Progress Calendar
        </a>
        <div class="nav-user-info">
          <span class="user-email" id="header-user-email"></span>
          <button id="logout-btn" class="btn btn-outline btn-sm">
            <i data-lucide="log-out"></i> Log Out
          </button>
        </div>
      </nav>
    </div>
  </header>

  <!-- View App Container -->
  <main id="app-container"></main>

  <!-- Global Toast Notification -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main JavaScript App -->
  <script type="module" src="/app.js"></script>
</body>
</html>
